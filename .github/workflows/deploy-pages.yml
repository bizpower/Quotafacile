name: Pubblica su GitHub Pages

# Il sito è HTML/CSS/JS statico senza build: la cartella viene
# pubblicata così com'è ad ogni push su main.
#
# ⚠️ Prima esecuzione utile: GitHub Pages va abilitato a mano una volta
# sola, perché crearlo richiede permessi di amministrazione che il token
# delle Actions non ha. Finché non è fatto, questo workflow si ferma
# subito con un avviso esplicativo invece di fallire: un errore rosso ad
# ogni merge non aiuta nessuno a capire cosa manca.
#
# Come abilitarlo: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifica:
    runs-on: ubuntu-latest
    outputs:
      attivo: ${{ steps.stato.outputs.attivo }}
    steps:
      - name: Pages è già abilitato?
        id: stato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODICE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$CODICE" = "200" ]; then
            echo "attivo=si" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages è abilitato: procedo con la pubblicazione."
          else
            echo "attivo=no" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages non è ancora abilitato su questo repository (risposta $CODICE), quindi non c'è nulla da pubblicare. Abilitalo una volta sola in Settings → Pages → Source: \"GitHub Actions\", poi rilancia questo workflow. Da quel momento ogni push su main pubblicherà automaticamente."
          fi

  deploy:
    needs: verifica
    if: needs.verifica.outputs.attivo == 'si'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configura Pages
        id: pages
        uses: actions/configure-pages@v5

      # Si pubblica quello che è un sito, non tutto il repository.
      #
      # Con "path: ." finivano online anche supabase/: il sorgente
      # della Edge Function e schema.sql, cioè la struttura completa
      # del database, scaricabili da chiunque conoscesse il percorso.
      # Non sono credenziali — quelle stanno nelle variabili
      # d'ambiente e nel Vault — ma sono la mappa di come è fatto
      # dentro, e non c'è nessun motivo per regalarla.
      #
      # L'elenco è per inclusione e non per esclusione: una cartella
      # nuova non finisce online per dimenticanza, ci finisce solo se
      # qualcuno la aggiunge qui.
      - name: Raccogli i file da pubblicare
        run: |
          set -euo pipefail
          mkdir -p _sito
          cp -r assets _sito/
          # sitemap.xml non si copia: non esiste nel repository.
          # La scrive il pre-render leggendo le rotte reali, così
          # una guida nuova ci finisce da sola e non c'è un secondo
          # elenco da ricordarsi di aggiornare a mano.
          cp index.html robots.txt llms.txt _sito/
          # Il dominio definitivo. Serve al percorso di pubblicazione
          # classico; con le Actions il dominio si imposta comunque
          # in Settings → Pages, ma tenerlo qui vuol dire che il
          # repository dichiara da solo dove va servito.
          cp CNAME _sito/
          echo "Pubblico:"
          find _sito -type f | sort

      # Il sito è una sola pagina che si disegna con JavaScript.
      # Per una persona va benissimo; per un motore di ricerca no,
      # perché il frammento (#/bacheca) non è un indirizzo e <main>
      # nell'HTML di partenza è vuoto. I crawler dei motori
      # generativi — che robots.txt invita esplicitamente — non
      # eseguono JavaScript: trovavano una pagina bianca.
      #
      # Qui ogni rotta pubblica viene aperta in un browser vero e
      # salvata come pagina HTML completa a un indirizzo reale, con
      # il proprio canonical e link interni veri. L'applicazione non
      # cambia: chi ha JavaScript continua a navigarla come prima.
      #
      # Playwright è una dipendenza del deploy, non del sito: nel
      # pacchetto pubblicato non finisce.
      - name: Node per il pre-render
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pre-renderizza le pagine pubbliche
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          npm i --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
          node tools/prerender.mjs _sito "${BASE%/}/"

      # Si pubblica quello che è un sito, non tutto il repository.
      #
      # Con "path: ." finivano online anche supabase/: il sorgente
      # della Edge Function e schema.sql, cioè la struttura completa
      # del database, scaricabili da chiunque conoscesse il percorso.
      # Non sono credenziali — quelle stanno nelle variabili
      # d'ambiente e nel Vault — ma sono la mappa di come è fatto
      # dentro, e non c'è nessun motivo per regalarla.
      #
      # L'elenco è per inclusione e non per esclusione: una cartella
      # nuova non finisce online per dimenticanza, ci finisce solo se
      # qualcuno la aggiunge qui.
      - name: Raccogli i file da pubblicare
        run: |
          set -euo pipefail
          mkdir -p _sito
          cp -r assets _sito/
          cp index.html robots.txt sitemap.xml llms.txt _sito/
          # Il dominio definitivo. Serve al percorso di pubblicazione
          # classico; con le Actions il dominio si imposta comunque
          # in Settings → Pages, ma tenerlo qui vuol dire che il
          # repository dichiara da solo dove va servito.
          cp CNAME _sito/
          echo "Pubblico:"
          find _sito -type f | sort

      - name: Prepara l'artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _sito
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
